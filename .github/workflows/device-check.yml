
name: Manaus Source Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check source repositories
        run: |
          for repo in \
            device_motorola_manaus \
            vendor_motorola_manaus \
            kernel_motorola_manaus
          do
            echo "===== $repo ====="
            git ls-remote \
              "https://github.com/RyannBreston/$repo.git" HEAD \
              || true
          done

      - name: Check device tree
        run: |
          git clone --depth=1 \
            https://github.com/RyannBreston/device_motorola_manaus.git \
            device

          cd device

          echo "===== BRANCH ====="
          git branch -a

          echo "===== BOARD CONFIG ====="
          grep -nE 'TARGET_|BOARD_|KERNEL_' BoardConfig.mk

          echo "===== MANIFEST PROJECTS ====="
          grep -n '<project' manifest.xml
